name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  infra:
    uses: TobyAnscombe/github-actions/.github/workflows/terraform-ci.yml@main
    with:
      terraform_version: "~> 1.5"
      tflint_version: "v0.63.0"
      working_directory: "infra"
      trivy_severity: "HIGH,CRITICAL"

  nexus-config:
    uses: TobyAnscombe/github-actions/.github/workflows/terraform-ci.yml@main
    with:
      terraform_version: "~> 1.5"
      tflint_version: "v0.63.0"
      working_directory: "nexus"
      trivy_severity: "HIGH,CRITICAL"

  claude-file-check:
    uses: TobyAnscombe/github-actions/.github/workflows/claude-file-check.yml@main

  protect-main:
    if: github.event_name == 'push'
    needs: [infra, nexus-config, claude-file-check]
    uses: TobyAnscombe/github-actions/.github/workflows/branch-protection.yml@main
    secrets:
      token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
    with:
      required_checks: '["infra / Terraform", "infra / TFLint", "infra / Security scan", "nexus-config / Terraform", "nexus-config / TFLint", "nexus-config / Security scan", "claude-file-check / claude-file-check"]'
