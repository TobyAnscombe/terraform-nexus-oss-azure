###############################################################################
# Reusable Terraform CI workflow
#
# Runs three jobs:
#   1. terraform  — fmt -check, init (no backend), validate
#   2. tflint     — Terraform linter with azurerm ruleset
#   3. security   — Trivy IaC misconfiguration scan
#
# Usage from any Terraform project:
#
#   jobs:
#     ci:
#       uses: TobyAnscombe/terraform-nexus-oss-azure/.github/workflows/terraform-ci.yml@main
#       with:
#         terraform_version: "~> 1.5"
#
# Prerequisites in the calling repo's working_directory:
#   - .tflint.hcl     (TFLint config with desired rulesets)
#   - .trivyignore    (accepted-risk suppressions with justifications)
###############################################################################

on:
  workflow_call:
    inputs:
      terraform_version:
        description: "Terraform version constraint passed to hashicorp/setup-terraform"
        type: string
        default: "~> 1.5"
      tflint_version:
        description: "TFLint version to install"
        type: string
        default: "v0.55.0"
      working_directory:
        description: "Directory containing the Terraform root module"
        type: string
        default: "."
      trivy_severity:
        description: "Comma-separated Trivy severity levels that fail the build"
        type: string
        default: "HIGH,CRITICAL"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format + validate
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # 2. TFLint
  # ---------------------------------------------------------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

  # ---------------------------------------------------------------------------
  # 3. Trivy IaC scan
  #
  # Installed via the aquasecurity apt repo rather than trivy-action or
  # install.sh — both have recurring version-resolution failures on
  # GitHub-hosted runners.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Trivy IaC scan
        run: |
          trivy config . \
            --severity ${{ inputs.trivy_severity }} \
            --exit-code 1 \
            --ignorefile .trivyignore
