name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1 — infrastructure (ACI, storage, networking)
  # ---------------------------------------------------------------------------
  infra:
    uses: TobyAnscombe/github-actions/.github/workflows/terraform-ci.yml@main
    with:
      terraform_version: "~> 1.5"
      tflint_version: "v0.55.0"
      working_directory: "infra"
      trivy_severity: "HIGH,CRITICAL"

  infra-apply:
    needs: infra
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_BACKEND_KEY: infra.tfstate
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  # ---------------------------------------------------------------------------
  # Phase 2 — Nexus configuration (repositories, routing rules, roles)
  # ---------------------------------------------------------------------------
  nexus-config:
    needs: infra
    uses: TobyAnscombe/github-actions/.github/workflows/terraform-ci.yml@main
    with:
      terraform_version: "~> 1.5"
      tflint_version: "v0.55.0"
      working_directory: "nexus"
      trivy_severity: "HIGH,CRITICAL"

  nexus-config-apply:
    needs: [nexus-config, infra-apply]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_admin_password: ${{ secrets.NEXUS_ADMIN_PASSWORD }}
          TF_VAR_state_storage_account: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
